<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cartograph</title>
    <style>
      :root {
        color-scheme: light;
        --ui: "Inter Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
        --ink: #3f3a52;
        --edge: rgba(120, 100, 150, 0.16);
        --accent: #d6558b;
      }
      html, body { height: 100%; margin: 0; }
      body {
        background: linear-gradient(160deg, #b8ccc7 0%, #aec7c3 55%, #b3c3cf 100%);
        background-attachment: fixed;
        color: var(--ink);
        font: 13px/1.5 var(--ui);
        display: flex;
        flex-direction: column;
      }
      #bar {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 11px 18px; border-bottom: 1px solid var(--edge);
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(18px) saturate(1.2);
        box-shadow: 0 1px 12px rgba(120, 90, 150, 0.07);
      }
      #bar h1 {
        font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -0.2px;
        background: linear-gradient(92deg, #e0568f, #b45ad8 55%, #7c5cf0);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }
      button {
        background: #fff; border: 1px solid var(--edge);
        color: #5c5470; border-radius: 8px; padding: 5px 13px; font-size: 12px;
        font-weight: 500; cursor: pointer; font-family: var(--ui);
        transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
      }
      button:hover {
        background: #fff; color: var(--accent); border-color: rgba(214, 85, 139, 0.4);
        box-shadow: 0 2px 8px rgba(150, 100, 160, 0.12);
      }
      #path {
        flex: 0 1 320px; padding: 6px 12px; font-size: 12px; font-family: var(--mono);
        background: #fff; color: var(--ink);
        border: 1px solid var(--edge); border-radius: 8px;
      }
      #path::placeholder { color: #a99cbb; }
      #path:focus { outline: none; border-color: var(--accent); }
      #path.err { border-color: #e0616f; }
      #hint { color: #8478a0; font-size: 11.5px; margin-left: auto; }
      #app { flex: 1; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; }
      svg { display: block; }
      .nd { cursor: grab; }
      .nd:active { cursor: grabbing; }
      .eh { cursor: grab; fill: rgba(124, 92, 240, 0.45); stroke: #fff; stroke-width: 1; }
      .eh:hover { fill: #7c5cf0; }
      .mrow { cursor: pointer; }
      .mrow:hover rect { fill: rgba(124, 92, 240, 0.1); }
      .mrow:hover text { fill: #1f1b30; }
      .note, .image, .group { cursor: grab; }
      .rz { cursor: nwse-resize; }
      .del { cursor: pointer; }
      .sep { width: 1px; height: 20px; background: rgba(120, 90, 160, 0.28); }
      text { user-select: none; }

      /* text editor modal */
      .cb-editwrap { padding: 12px 16px; }
      .cb-edit {
        width: 100%; box-sizing: border-box; background: rgba(250, 245, 252, 0.95);
        color: #3a3352; border: 1px solid rgba(120, 90, 160, 0.25); border-radius: 10px;
        padding: 9px 11px; font: 13px/1.5 var(--mono); resize: vertical;
      }
      .cb-edit:focus { outline: none; border-color: rgba(139, 92, 246, 0.6); }
      .cb-actions { display: flex; justify-content: flex-end; padding: 0 16px 14px; }
      .cb-save { background: rgba(139, 92, 246, 0.9); color: #fff; border-color: transparent; }
      .cb-save:hover { background: rgba(139, 92, 246, 1); color: #fff; }

      /* relation legend */
      #legend {
        position: fixed; left: 16px; bottom: 16px; z-index: 20;
        background: rgba(255, 255, 255, 0.5); border: 1px solid var(--glass-edge);
        border-radius: 14px; padding: 10px 14px; font-size: 11.5px; color: #5a4f70;
        display: none; flex-direction: column; gap: 4px;
        backdrop-filter: blur(12px) saturate(1.2);
        box-shadow: 0 8px 28px rgba(150, 110, 180, 0.18);
      }
      #legend.on { display: flex; }
      #legend .lg-row { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
      #legend .lg-sw { width: 34px; text-align: center; font-weight: 700; letter-spacing: -1px; }
      #legend .lg-sep { height: 1px; margin: 4px 0; background: var(--glass-edge); }
      #legend .lg-title { margin: 2px 0 1px; font-size: 10.5px; font-weight: 600; color: #8a7fa0;
        text-transform: uppercase; letter-spacing: 0.06em; }
      #legend .lg-box { display: inline-block; width: 18px; height: 12px; border-radius: 3px;
        vertical-align: middle; box-sizing: border-box; }
      /* a relation row highlights its edges; a click anywhere on the canvas clears it */
      #legend .lg-pick { cursor: pointer; border-radius: 7px; margin: 0 -6px; padding: 1px 6px; }
      #legend .lg-pick:hover { background: rgba(139, 92, 246, 0.1); }
      #legend .lg-pick.active { background: rgba(139, 92, 246, 0.2); color: #3d3556; font-weight: 600; }
      #app.hl g.edge { opacity: 0.12; transition: opacity 0.15s; }
      #app.hl g.edge.on { opacity: 1; }
      #app.hl g.edge.touch { opacity: 0.75; }
      #app.hl g.edge.on path, #app.hl g.edge.on polygon { stroke-width: 3.4; }
      #app.hl g.nd { opacity: 0.28; transition: opacity 0.15s; }
      #app.hl g.nd.on { opacity: 1; }
      #app.hl g.nd.on > rect:first-child { stroke: #7c3aed; stroke-width: 3; }
      #app.hl .eh { opacity: 0.15; } /* the bend dots would otherwise stay bright */

      /* method detail popup */
      .cb-backdrop {
        position: fixed; inset: 0; background: rgba(90, 50, 100, 0.26);
        backdrop-filter: blur(3px);
        display: flex; align-items: center; justify-content: center; z-index: 50;
      }
      .cb-modal {
        width: min(760px, 92vw); max-height: 84vh; display: flex; flex-direction: column;
        background: rgba(255, 255, 255, 0.92); border: 1px solid var(--glass-edge);
        border-radius: 16px; box-shadow: 0 24px 70px rgba(120, 80, 150, 0.3);
        backdrop-filter: blur(20px);
        overflow-y: auto; /* one scroll for the docstring and the code, so the code is never squeezed */
      }
      .cb-head {
        display: flex; align-items: center; gap: 12px; padding: 13px 16px;
        border-bottom: 1px solid rgba(120, 90, 160, 0.14);
        position: sticky; top: 0; z-index: 1; background: #fbf9fd;
      }
      .cb-title { font-size: 15px; font-family: var(--mono); color: #3d3556; }
      .cb-title .cb-owner { color: #9b6dd6; }
      .cb-title b { color: #2a2340; }
      .cb-close { margin-left: auto; padding: 2px 9px; border-radius: 999px; line-height: 1.2; }
      .cb-sub { padding: 7px 16px 0; color: #8a7fa0; font-size: 11.5px; font-family: var(--mono); }
      .cb-doc { margin: 11px 16px 6px; color: #4a4363; }
      .cb-doc > :last-child { margin-bottom: 0; }
      .cb-doc.cb-empty { color: #9a90ad; font-style: italic; }
      /* the source, in PyCharm's default light theme (IntelliJ Light) */
      .cb-src {
        flex-shrink: 0; margin: 6px 16px 16px; padding: 13px 15px; overflow-x: auto;
        background: #ffffff; border: 1px solid #ebecf0;
        border-radius: 10px; font: 13px/1.6 "JetBrains Mono", var(--mono); color: #080808;
        white-space: pre; tab-size: 4;
      }
      .hl-kw { color: #0033b3; }
      .hl-str { color: #067d17; }
      .hl-doc { color: #067d17; font-style: italic; }
      .hl-com { color: #8c8c8c; font-style: italic; }
      .hl-num { color: #1750eb; }
      .hl-deco { color: #9e880d; }
      .hl-fn { color: #00627a; }
      .hl-self { color: #94558d; }
      .hl-bi { color: #000080; }
      .hl-dunder { color: #b200b2; }
      .hl-kwarg { color: #660099; }

      /* a docstring rendered from Google / NumPy sections and Markdown-style marks */
      .ds { line-height: 1.5; }
      .ds p { margin: 0 0 7px; }
      .ds .ds-sec { margin: 9px 0 3px; font-weight: 600; font-size: 12px; color: #6b4fa0; }
      .ds dl { margin: 0 0 4px; }
      .ds dt { font-family: var(--mono); font-size: 12.5px; }
      .ds dd { margin: 1px 0 6px 16px; }
      .ds .ds-type { color: #8a7fa0; font-size: 12px; }
      .ds .ds-type::before { content: "("; }
      .ds .ds-type::after { content: ")"; }
      .ds ul { margin: 0 0 7px; padding-left: 18px; }
      .ds code { font-family: var(--mono); font-size: 0.92em; padding: 0 4px; border-radius: 4px;
        background: rgba(139, 92, 246, 0.1); color: #3d3556; }
      .ds pre { margin: 0 0 7px; padding: 6px 9px; border-radius: 7px; overflow: hidden;
        background: rgba(250, 246, 253, 0.9); font: 12px/1.5 var(--mono); white-space: pre; }
      .ds pre code { padding: 0; background: none; }

      /* hover tip: a method's (or class's) docstring, left of its box; never takes the pointer */
      #doctip {
        position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none;
        width: max-content; max-width: min(440px, 44vw); max-height: 72vh; overflow: hidden;
        padding: 10px 13px 9px; font-size: 13px; color: #3d3556;
        background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(14px);
        border: 1px solid var(--glass-edge); border-radius: 12px;
        box-shadow: 0 14px 40px rgba(120, 80, 150, 0.22);
        opacity: 0; visibility: hidden; transition: opacity 0.12s;
      }
      #doctip.on { opacity: 1; visibility: visible; }
      #doctip .dt-head { margin-bottom: 7px; padding-bottom: 6px; font: 13px var(--mono);
        border-bottom: 1px solid rgba(120, 90, 160, 0.14); }
      #doctip .dt-owner { color: #9b6dd6; }
      #doctip .dt-none { color: #9a90ad; font-style: italic; }
      #doctip .ds > :last-child { margin-bottom: 0; }
      /* An exported board has no dev server behind it: scanning, browsing and loading another
         document would all fail, so they are not offered. Everything that edits the board stays. */
      body.standalone #browse,
      body.standalone #path,
      body.standalone #scan,
      body.standalone #load {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <h1>cartograph</h1>
      <button id="browse">browse…</button>
      <input id="path" type="text" spellcheck="false"
             placeholder="/path/to/a/python/project" />
      <button id="scan">scan</button>
      <span class="sep"></span>
      <button id="add-note">+ note</button>
      <button id="add-group">+ group</button>
      <button id="lines">lines: curved</button>
      <button id="fn">functions</button>
      <button id="save">save</button>
      <button id="export-html">export html</button>
      <button id="load">load</button>
      <button id="reset">reset</button>
      <input id="file" type="file" accept="application/json" hidden />
      <span id="hint">drag a class · drag a line's dot to bend · click the dot to switch curved/90°</span>
    </div>
    <div id="app"></div>
    <div id="legend"></div>
    <!-- An exported board inlines its whole document here, so opening that file needs no server
         and no re-scan: the layout that comes back is exactly the one that was exported. Stays
         `null` in the live app — the export rewrites this element's text and nothing else. -->
    <script id="cartograph-doc" type="application/json">null</script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
