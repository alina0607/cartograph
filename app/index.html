<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cartograph</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #0d0a1f;
        color: #f2f1fa;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        display: flex;
        flex-direction: column;
      }
      #bar {
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,.12);
        background: rgba(255,255,255,.03);
      }
      #bar h1 {
        font-size: 14px; margin: 0; font-weight: 600;
        background: linear-gradient(92deg, #4da3ff, #6a7bff 45%, #a86bff);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }
      button {
        background: rgba(106,123,255,.16); border: 1px solid rgba(106,123,255,.34);
        color: #c7c3e2; border-radius: 7px; padding: 4px 11px; font-size: 12px;
        cursor: pointer; font-family: inherit;
      }
      button:hover { background: rgba(106,123,255,.28); color: #fff; }
      #path {
        flex: 0 1 320px; padding: 4px 10px; font-size: 12px;
        font-family: ui-monospace, Menlo, monospace;
        background: rgba(255,255,255,.05); color: #e8e6f5;
        border: 1px solid rgba(255,255,255,.16); border-radius: 7px;
      }
      #path:focus { outline: none; border-color: rgba(106,123,255,.6); }
      #path.err { border-color: #e0616f; }
      #hint { color: #8f89ba; font-size: 11.5px; margin-left: auto; }
      #app { flex: 1; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; }
      svg { display: block; }
      .nd { cursor: grab; }
      .nd:active { cursor: grabbing; }
      .eh { cursor: grab; fill: rgba(120,140,255,.55); stroke: #cdd4ff; stroke-width: 1; }
      .eh:hover { fill: #9db0ff; }
      .mrow { cursor: pointer; }
      .mrow:hover rect { fill: rgba(120,140,255,.16); }
      .mrow:hover text { fill: #fff; }
      .note, .image, .group { cursor: grab; }
      .rz { cursor: nwse-resize; }
      .del { cursor: pointer; }
      .sep { width: 1px; height: 20px; background: rgba(255,255,255,.14); }
      text { user-select: none; }

      /* text editor modal */
      .cb-editwrap { padding: 12px 16px; }
      .cb-edit {
        width: 100%; box-sizing: border-box; background: #0d0a1f; color: #e8e6f5;
        border: 1px solid rgba(255,255,255,.16); border-radius: 8px; padding: 8px 10px;
        font: 13px/1.5 ui-monospace, Menlo, monospace; resize: vertical;
      }
      .cb-edit:focus { outline: none; border-color: rgba(106,123,255,.6); }
      .cb-actions { display: flex; justify-content: flex-end; padding: 0 16px 14px; }
      .cb-save { background: rgba(106,123,255,.3); }

      /* relation legend */
      #legend {
        position: fixed; left: 14px; bottom: 14px; z-index: 20;
        background: rgba(21,18,43,.86); border: 1px solid rgba(255,255,255,.12);
        border-radius: 10px; padding: 8px 12px; font-size: 11.5px; color: #b7b2d8;
        display: none; flex-direction: column; gap: 3px; backdrop-filter: blur(4px);
      }
      #legend.on { display: flex; }
      #legend .lg-row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
      #legend .lg-sw { width: 34px; text-align: center; font-weight: 700; letter-spacing: -1px; }

      /* method detail popup */
      .cb-backdrop {
        position: fixed; inset: 0; background: rgba(6,4,16,.62);
        display: flex; align-items: center; justify-content: center; z-index: 50;
      }
      .cb-modal {
        width: min(760px, 92vw); max-height: 84vh; display: flex; flex-direction: column;
        background: #15122b; border: 1px solid rgba(150,140,220,.28); border-radius: 12px;
        box-shadow: 0 24px 70px rgba(0,0,0,.55); overflow: hidden;
      }
      .cb-head {
        display: flex; align-items: center; gap: 12px; padding: 12px 16px;
        border-bottom: 1px solid rgba(255,255,255,.1);
      }
      .cb-title { font-size: 15px; font-family: ui-monospace, Menlo, monospace; }
      .cb-title .cb-owner { color: #a89fd8; }
      .cb-title b { color: #f2f1fa; }
      .cb-close {
        margin-left: auto; padding: 2px 9px; border-radius: 6px; line-height: 1.2;
      }
      .cb-sub {
        padding: 6px 16px 0; color: #7d78a6; font-size: 11.5px;
        font-family: ui-monospace, Menlo, monospace;
      }
      .cb-doc { margin: 10px 16px 6px; color: #d7d3ee; }
      .cb-doc.cb-empty { color: #7d78a6; font-style: italic; }
      .cb-src {
        margin: 6px 16px 16px; padding: 12px 14px; overflow: auto;
        background: #0d0a1f; border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
        font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cfcbe8; white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <h1>cartograph</h1>
      <button id="browse">browse…</button>
      <input id="path" type="text" spellcheck="false"
             placeholder="/path/to/a/python/project" />
      <button id="scan">scan</button>
      <span class="sep"></span>
      <button id="add-note">+ note</button>
      <button id="add-group">+ group</button>
      <button id="docs">docs</button>
      <button id="save">save</button>
      <button id="load">load</button>
      <button id="reset">reset</button>
      <input id="file" type="file" accept="application/json" hidden />
      <span id="hint">drag a class · drag a line's dot to bend · paste/drop an image</span>
    </div>
    <div id="app"></div>
    <div id="legend"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
