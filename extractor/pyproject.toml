[project]
name = "cartograph"
version = "0.1.0"
description = "Extract classes and their relationships from source into cartograph's seed.json"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alina Chuang" }]
# Python uses the stdlib ast; TypeScript and Go use tree-sitter grammars.
dependencies = [
  "tree-sitter==0.25.2",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-go==0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
cartograph-extract = "cartograph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartograph"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
